<div class="app">
  <header class="bar">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <circle cx="17" cy="15" r="11" fill="var(--sea-1)" stroke="var(--coast)" stroke-width="1.2"/>
        <ellipse cx="17" cy="15" rx="4.6" ry="11" fill="none" stroke="var(--coast)" stroke-width=".9"/>
        <path d="M6 15h22" stroke="var(--coast)" stroke-width=".9"/>
        <path d="M4.2 15a12.8 12.8 0 0 0 25.6 0" fill="none" stroke="var(--brass-hi)" stroke-width="2"/>
        <path d="M17 28v4M12 32h10" stroke="var(--brass-hi)" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>ごちそう地球儀</h1>
        <p id="brand-sub">回して、止まった国を知る</p>
      </div>
    </div>
    <div class="barright">
      <span class="worldchip" id="world-chip" hidden></span>
      <div class="tabs" role="tablist" aria-label="モード">
        <button role="tab" id="tab-explore" aria-selected="true" aria-controls="view-explore">探検</button>
        <button role="tab" id="tab-quiz" aria-selected="false" aria-controls="view-quiz">クイズ</button>
        <button role="tab" id="tab-battle" aria-selected="false" aria-controls="view-battle">対戦</button>
        <button role="tab" id="tab-hist" aria-selected="false" aria-controls="view-hist" hidden>図鑑</button>
        <button role="tab" id="tab-hquiz" aria-selected="false" aria-controls="view-hquiz" hidden>クイズ</button>
      </div>
      <div class="menuwrap">
        <button class="menubtn" id="menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="menu" aria-label="メニュー(表示モードと地図の形)">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="1.9" fill="currentColor"/><circle cx="10" cy="10" r="1.9" fill="currentColor"/><circle cx="16" cy="10" r="1.9" fill="currentColor"/></svg>
        </button>
        <div class="menu" id="menu" hidden>
          <p class="menuh">表示モード</p>
          <button class="mitem" data-world="modern" aria-pressed="true"><b>現代の地図</b><small>いまの国と都市、豆知識</small></button>
          <button class="mitem" data-world="history" aria-pressed="false"><b>タイムスリップ</b><small>西暦1年から1年ずつ、世界史の地図と図鑑</small></button>
          <button class="mitem" data-world="food" aria-pressed="false"><b>ごちそう<span class="badge">特別</span></b><small>郷土料理と作り方</small></button>
          <p class="menuh">地図の形</p>
          <div class="seg menuseg" role="group" aria-label="地図の形">
            <button data-shape="globe" aria-pressed="true">地球儀</button>
            <button data-shape="flat" aria-pressed="false">平面</button>
          </div>
          <p class="menuh">案内</p>
          <button class="mitem" data-lag="replay"><b>使い方を聞く</b><small>銀河義賊ラグ☆ジュアリ～が案内します</small></button>
          <button class="tog menutog" id="lag-intros" aria-pressed="true">モードを初めて開いたときに紹介する</button>
        </div>
      </div>
    </div>
  </header>

  <main class="layout">
    <div class="leftcol">
      <section class="stage" id="stage" aria-label="地球儀">
        <canvas id="globe" tabindex="0" aria-label="回せる地球儀。ドラッグで回転、ホイールやピンチで拡大、クリックで国や都市を選択"></canvas>

        <div class="ov top">
          <div class="search">
            <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.6 3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <input id="q" type="search" placeholder="国名・都市名で探す" autocomplete="off" aria-label="国名・都市名で探す" aria-controls="suggest">
            <ul class="suggest" id="suggest" role="listbox" hidden></ul>
          </div>
          <div class="toggles">
            <button class="tog" id="t-labels" aria-pressed="true">国名</button>
            <button class="tog" id="t-cities" aria-pressed="true">都市</button>
            <button class="tog" id="t-modern" aria-pressed="false" hidden>現代の国境</button>
            <button class="tog" id="t-auto" aria-pressed="true">自動回転</button>
            <button class="tog" id="t-sfx" aria-pressed="true">効果音</button>
          </div>
        </div>

        <div class="ov readout" id="readout" hidden></div>
        <div class="ov tip" id="tip" hidden></div>
        <div class="ov toast" id="toast" hidden></div>
        <div class="ov cmplabels" id="cmp-labels" hidden><span id="cmp-l"></span><span id="cmp-r"></span></div>
        <div class="ov loading" id="h-loading" hidden>地図を読み込んでいます…</div>

        <div class="ov zoom">
          <button id="z-in" aria-label="拡大">＋</button>
          <button id="z-out" aria-label="縮小">−</button>
          <button id="z-home" aria-label="全体を表示">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><ellipse cx="8" cy="8" rx="2.6" ry="6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
        </div>

        <div class="ov spin" id="spin-wrap">
          <button class="spin-btn" id="spin-btn">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M15 9a6 6 0 1 1-2-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M13.6 1.6v3.6H10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="spin-label">シャッフル</span>
          </button>
          <div class="seg" id="target-seg" role="group" aria-label="シャッフルの対象">
            <button data-t="both" aria-pressed="true">国と都市</button>
            <button data-t="country" aria-pressed="false">国</button>
            <button data-t="city" aria-pressed="false">都市</button>
          </div>
        </div>

        <div class="ov coords mono" id="coords"></div>
      </section>

      <section class="timebar" id="timebar" aria-label="年代" hidden>
        <div class="tb-row tb-head">
          <div class="yearbox">
            <span class="era-ce">西暦</span>
            <button class="yearbtn mono" id="tb-year" title="クリックして年を入力">1</button>
            <form id="tb-yform" hidden><input id="tb-yinput" class="mono" type="number" min="1" max="2024" step="1" aria-label="年を入力"></form>
            <span class="era-ce">年</span>
          </div>
          <span class="jpera" id="tb-jp" title="この年の日本"></span>
          <span class="tb-follow" id="tb-follow" hidden></span>
        </div>
        <div class="tb-slider">
          <div class="tb-ticks" id="tb-ticks" aria-hidden="true"></div>
          <input type="range" id="tb-range" min="1" max="2024" step="1" value="1" aria-label="年代(1年ずつ)">
        </div>
        <div class="tb-row tb-btns">
          <button class="tb" data-step="-100" aria-label="100年前へ">«100</button>
          <button class="tb" data-step="-10" aria-label="10年前へ">‹10</button>
          <button class="tb" data-step="-1" aria-label="1年前へ">‹1</button>
          <button class="tb play" id="tb-play" aria-label="再生">▶</button>
          <button class="tb" data-step="1" aria-label="1年後へ">1›</button>
          <button class="tb" data-step="10" aria-label="10年後へ">10›</button>
          <button class="tb" data-step="100" aria-label="100年後へ">100»</button>
        </div>
        <div class="tb-row tb-opts">
          <div class="seg" id="tb-speed" role="group" aria-label="再生の速さ">
            <button data-sp="slow" aria-pressed="false">ゆっくり</button>
            <button data-sp="normal" aria-pressed="true">ふつう</button>
            <button data-sp="fast" aria-pressed="false">はやい</button>
          </div>
          <button class="tog" id="tb-cmp" aria-pressed="false">2つの年を比べる</button>
        </div>
        <div class="tb-row tb-cmprow" id="tb-cmprow" hidden>
          <span class="lbl">左側の年</span>
          <button class="tb" data-cstep="-100">«100</button>
          <button class="tb" data-cstep="-10">‹10</button>
          <input id="tb-cyear" class="mono cyear" type="number" min="1" max="2024" step="1" aria-label="比べる年">
          <button class="tb" data-cstep="10">10›</button>
          <button class="tb" data-cstep="100">100»</button>
          <small class="note">地図の仕切りを左右にドラッグできます</small>
        </div>
      </section>
    </div>

    <aside class="panel" id="panel">
      <div id="view-explore" role="tabpanel" aria-labelledby="tab-explore"></div>
      <div id="view-quiz" role="tabpanel" aria-labelledby="tab-quiz" hidden></div>
      <div id="view-battle" role="tabpanel" aria-labelledby="tab-battle" hidden></div>
      <div id="view-hist" role="tabpanel" aria-labelledby="tab-hist" hidden></div>
      <div id="view-hquiz" role="tabpanel" aria-labelledby="tab-hquiz" hidden></div>
      <div class="foot">
        <p class="note" id="foot-note">地図: Natural Earth 1:50m(world-atlas)。国境線は実効支配線にもとづき、帰属に争いのある地域は斜線で示しています。</p>
      </div>
    </aside>
  </main>
</div>

<div class="lag" id="lag" hidden>
  <div class="lag-spot" id="lag-spot" hidden></div>
  <div class="lag-wrap">
    <img class="lag-sprite" id="lag-sprite" alt="" aria-hidden="true">
    <div class="lag-box" id="lag-box" role="dialog" aria-label="銀河義賊ラグ☆ジュアリ～の案内" tabindex="-1">
      <p class="lag-name"><small>銀河義賊</small>ラグ☆ジュアリ～</p>
      <button class="lag-skip" id="lag-skip">スキップ</button>
      <p class="lag-text" id="lag-text" aria-hidden="true"></p>
      <p class="sr" id="lag-live" aria-live="polite"></p>
      <div class="lag-choices" id="lag-choices" hidden></div>
      <span class="lag-more" id="lag-more" aria-hidden="true" hidden>▼</span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>

<script>window.GLOBE_QUIZ = __QUIZ__;</script>
<script>

</script>
