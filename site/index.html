<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ごちそう地球儀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: a brass-and-paper globe tray on the left, an atlas reference card on the right; stacks on phones */
:root{
  --paper:#E6ECE9; --panel:#F6F8F5; --stage:#D7E0DC; --glass:rgba(246,248,245,.9);
  --ink:#1B2A33; --ink-2:#4A5A62; --ink-3:#77868C; --rule:#C6D0CC;
  --brass:#8C6414; --brass-hi:#CC9C40; --brass-soft:#F0E4C6; --on-brass:#1E1606;
  --sea-1:#C3DCE0; --sea-2:#86AEBB; --sea-ink:#3D6C7A; --grat:rgba(38,78,92,.16); --shade:rgba(8,28,38,.26); --glow:rgba(110,160,176,.5);
  --land-1:#ECDDAF; --land-2:#CADDB0; --land-3:#EFCCB2; --land-4:#D6CDE4; --land-5:#BBD9C8;
  --border:#6C7D78; --coast:#46666F; --hover:rgba(27,42,51,.13); --hilite:#E2AE48; --target:#2D5DA6;
  --halo:rgba(246,248,245,.92); --label:#1F2E36;
  --ok:#2A7A4B; --ng:#B0392C; --ok-soft:#DCEEE2; --ng-soft:#F5DCD7;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:14px;
  --h-0:#E7C79B; --h-1:#B7D2A5; --h-2:#DDB4C8; --h-3:#C7BFE4; --h-4:#EADB93; --h-5:#EAB2A0; --h-6:#A6D3C0; --h-7:#D5C4A5;
  --h-none:#E7E4DA; --h-line:rgba(60,48,40,.55); --h-group:#5B3F2A; --h-modern:#B0392C;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E161B; --panel:#141F26; --stage:#0A1115; --glass:rgba(20,31,38,.9);
    --ink:#E2E8E5; --ink-2:#A8B5B8; --ink-3:#77878C; --rule:#24333B;
    --brass:#DDB462; --brass-hi:#D6A94F; --brass-soft:#3A2F17; --on-brass:#1A1305;
    --sea-1:#23485A; --sea-2:#0F2632; --sea-ink:#8DB6C4; --grat:rgba(150,200,215,.14); --shade:rgba(0,0,0,.42); --glow:rgba(70,130,155,.38);
    --land-1:#80785A; --land-2:#657A5D; --land-3:#846858; --land-4:#6C6280; --land-5:#587868;
    --border:#1C2A31; --coast:#9ABCC4; --hover:rgba(255,255,255,.14); --hilite:#E0AE52; --target:#7EA6EC;
    --halo:rgba(14,22,27,.88); --label:#EEF2F0;
    --ok:#62C08A; --ng:#E57A68; --ok-soft:#173327; --ng-soft:#3A1E1A;
    --h-0:#8C6F4B; --h-1:#5E7B53; --h-2:#80596E; --h-3:#675E8A; --h-4:#867B44; --h-5:#8C594B; --h-6:#4C7A68; --h-7:#78694E;
    --h-none:#2C353A; --h-line:rgba(10,14,16,.75); --h-group:#E9C88E; --h-modern:#F08C7A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E161B; --panel:#141F26; --stage:#0A1115; --glass:rgba(20,31,38,.9);
  --ink:#E2E8E5; --ink-2:#A8B5B8; --ink-3:#77878C; --rule:#24333B;
  --brass:#DDB462; --brass-hi:#D6A94F; --brass-soft:#3A2F17; --on-brass:#1A1305;
  --sea-1:#23485A; --sea-2:#0F2632; --sea-ink:#8DB6C4; --grat:rgba(150,200,215,.14); --shade:rgba(0,0,0,.42); --glow:rgba(70,130,155,.38);
  --land-1:#80785A; --land-2:#657A5D; --land-3:#846858; --land-4:#6C6280; --land-5:#587868;
  --border:#1C2A31; --coast:#9ABCC4; --hover:rgba(255,255,255,.14); --hilite:#E0AE52; --target:#7EA6EC;
  --halo:rgba(14,22,27,.88); --label:#EEF2F0;
  --ok:#62C08A; --ng:#E57A68; --ok-soft:#173327; --ng-soft:#3A1E1A;
  --h-0:#8C6F4B; --h-1:#5E7B53; --h-2:#80596E; --h-3:#675E8A; --h-4:#867B44; --h-5:#8C594B; --h-6:#4C7A68; --h-7:#78694E;
  --h-none:#2C353A; --h-line:rgba(10,14,16,.75); --h-group:#E9C88E; --h-modern:#F08C7A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-rows:auto 1fr;min-height:100%;padding-inline:16px;padding-block:0 16px;gap:12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.45rem;letter-spacing:.06em;line-height:1.2}
.brand p{margin:0;font-size:.78rem;color:var(--ink-3);letter-spacing:.04em}
.tabs{display:inline-flex;background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;padding:6px 18px;border-radius:999px;font-weight:700;color:var(--ink-2);letter-spacing:.08em}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--panel)}

.layout{display:grid;gap:16px;min-height:0}
.stage{position:relative;background:var(--stage);border-radius:var(--radius);overflow:hidden;height:60vh;height:min(62svh,580px);min-height:340px;isolation:isolate}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
.stage canvas:active{cursor:grabbing}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);min-width:0}
.leftcol{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
@media (min-width:960px){
  .app{height:100%}
  .layout{grid-template-columns:minmax(0,1fr) 420px}
  .stage{height:auto;min-height:0;flex:1 1 auto}
  .panel{overflow:auto;min-height:0}
}

/* stage overlays */
.ov{position:absolute;z-index:2}
.top{top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;pointer-events:none}
.top > *{pointer-events:auto}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search input{width:100%;border:1px solid var(--rule);background:var(--glass);border-radius:10px;padding:8px 12px 8px 34px;outline:none;backdrop-filter:blur(6px)}
.search input:focus{border-color:var(--brass)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none;z-index:1}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);max-height:300px;overflow:auto}
.suggest li{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:7px;cursor:pointer}
.suggest li[aria-selected="true"],.suggest li:hover{background:var(--brass-soft)}
.suggest small{color:var(--ink-3);white-space:nowrap}
.toggles{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tog{border:1px solid var(--rule);background:var(--glass);border-radius:999px;padding:5px 12px;font-size:.82rem;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;backdrop-filter:blur(6px)}
.tog::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor}
.tog[aria-pressed="true"]{color:var(--ink)}
.tog[aria-pressed="true"]::before{background:var(--brass-hi);border-color:var(--brass-hi)}
.zoom{left:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--rule);background:var(--glass);font-size:1.1rem;line-height:1;display:grid;place-items:center;backdrop-filter:blur(6px)}
.coords{right:14px;bottom:14px;font-size:.74rem;color:var(--ink-2);background:var(--glass);border:1px solid var(--rule);padding:3px 9px;border-radius:7px;letter-spacing:.02em}
.spin{left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
.spin-btn{border:0;border-radius:999px;background:var(--brass-hi);color:var(--on-brass);font-weight:700;letter-spacing:.12em;padding:11px 26px;font-size:1rem;box-shadow:0 6px 18px rgba(80,56,10,.28),inset 0 -2px 0 rgba(0,0,0,.14);display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.spin-btn:disabled{opacity:.55;cursor:default}
.spin-btn svg{flex:none}
.seg{display:inline-flex;background:var(--glass);border:1px solid var(--rule);border-radius:999px;padding:2px;backdrop-filter:blur(6px)}
.seg button{border:0;background:transparent;border-radius:999px;padding:3px 11px;font-size:.78rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.readout{left:50%;top:58px;transform:translateX(-50%);background:var(--ink);color:var(--panel);font-weight:700;letter-spacing:.06em;padding:5px 14px;border-radius:999px;font-size:.92rem;white-space:nowrap}
.tip{pointer-events:none;background:var(--ink);color:var(--panel);font-size:.8rem;padding:3px 9px;border-radius:6px;white-space:nowrap;transform:translate(12px,-130%)}
.toast{left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);color:var(--panel);padding:8px 16px;border-radius:10px;font-size:.88rem;z-index:5;max-width:calc(100% - 32px);text-align:center}
@media (max-width:620px){
  .coords{display:none}
  .spin-btn{padding:10px 20px;font-size:.95rem}
  .search{max-width:none;flex-basis:100%}
  .toggles{margin-left:0}
  .readout{top:98px}
}

/* panel */
.pane{padding:20px 22px 24px;display:flex;flex-direction:column;gap:18px}
.eyebrow{margin:0;font-size:.75rem;letter-spacing:.14em;color:var(--brass);font-weight:700}
.pname{margin:2px 0 0;font-family:var(--f-display);font-weight:800;font-size:2.1rem;line-height:1.2;letter-spacing:.04em;text-wrap:balance}
.pen{margin:0;color:var(--ink-3);font-size:.86rem;letter-spacing:.03em}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin:0}
.meta div{background:var(--panel);padding:8px 12px;min-width:0}
.meta dt{font-size:.7rem;color:var(--ink-3);letter-spacing:.12em}
.meta dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.sec h3{margin:0 0 8px;font-size:.8rem;letter-spacing:.16em;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.sec h3::after{content:"";flex:1;height:1px;background:var(--rule)}
.dishes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.dish{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.dish b{font-size:1.02rem;font-family:var(--f-display);font-weight:800;letter-spacing:.03em}
.dish p{grid-column:1/2;margin:0;font-size:.86rem;color:var(--ink-2);line-height:1.6}
.dish a{grid-row:1/3;grid-column:2;align-self:center}
.go{display:inline-flex;flex-direction:column;align-items:flex-start;gap:0;text-decoration:none;color:var(--ink);background:var(--brass-soft);border:1px solid color-mix(in srgb,var(--brass-hi) 45%,transparent);border-radius:9px;padding:6px 10px;font-size:.8rem;font-weight:700;line-height:1.35}
.go{max-width:11em}
.go span{font-weight:400;font-size:.7rem;color:var(--ink-2);overflow-wrap:anywhere}
.go-wide{max-width:none}
.go:hover{border-color:var(--brass-hi)}
.go-wide{flex-direction:row;align-items:center;gap:8px;margin-top:10px}
.trivia{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.trivia li{position:relative;padding-left:18px;font-size:.92rem}
.trivia li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;background:var(--brass-hi);transform:rotate(45deg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:.84rem}
.chip:hover{border-color:var(--brass-hi)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.empty{color:var(--ink-3);font-size:.88rem;margin:0}
.note{font-size:.72rem;color:var(--ink-3);margin:0;line-height:1.6}
.note a{color:var(--brass)}

/* quiz */
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.score div{background:var(--panel);padding:8px 12px}
.score span{display:block}
.score .k{font-size:.7rem;letter-spacing:.12em;color:var(--ink-3)}
.score .v{font-size:1.25rem;font-weight:500}
details.settings{border:1px solid var(--rule);border-radius:10px;padding:0 12px}
details.settings summary{cursor:pointer;padding:10px 0;font-weight:700;font-size:.88rem;display:flex;justify-content:space-between;gap:8px}
details.settings summary small{font-weight:400;color:var(--ink-3)}
.set{display:flex;flex-direction:column;gap:6px;padding-bottom:12px}
.set label.lbl{font-size:.72rem;letter-spacing:.12em;color:var(--ink-3)}
.switch{display:flex;align-items:center;gap:8px;font-size:.88rem}
.qcard{border:1px solid var(--rule);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--paper)}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.78rem;color:var(--ink-2)}
.stars{color:var(--brass);letter-spacing:.06em}
.tag{border:1px solid var(--rule);border-radius:999px;padding:1px 9px;background:var(--panel)}
.qtext{margin:0;font-size:1.08rem;line-height:1.75;font-weight:500;min-height:3.5em}
.caret{display:inline-block;width:.55em;height:1.05em;margin-left:2px;vertical-align:-.12em;background:var(--brass-hi);border-radius:2px;animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
@media (prefers-reduced-motion: reduce){.caret{animation:none}}
.ansrow{display:flex;gap:8px}
.ansrow input{flex:1;min-width:0;border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--panel);outline:none}
.ansrow input:focus{border-color:var(--brass)}
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:10px;padding:9px 16px;font-weight:700;font-size:.9rem}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.brass{background:var(--brass-hi);color:var(--on-brass);border-color:var(--brass-hi)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.choices button{border:1px solid var(--rule);background:var(--panel);border-radius:10px;padding:12px 10px;font-weight:700;text-align:center}
.choices button:hover{border-color:var(--brass-hi)}
.hint{margin:0;font-size:.88rem;background:var(--brass-soft);border-radius:8px;padding:7px 11px}
.verdict{font-family:var(--f-display);font-weight:800;font-size:1.6rem;letter-spacing:.08em;margin:0}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.result{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.result.ok{background:var(--ok-soft)} .result.ng{background:var(--ng-soft)}
.result p{margin:0}
.answer b{font-family:var(--f-display);font-size:1.3rem;font-weight:800;letter-spacing:.04em}
.expl{font-size:.92rem;color:var(--ink-2)}
.lead{margin:0;color:var(--ink-2);font-size:.92rem}
.foot{padding:0 22px 20px}
.tabs button{padding:6px 14px}
textarea{width:100%;min-height:84px;border:1px solid var(--rule);border-radius:10px;padding:8px 10px;background:var(--panel);font:inherit;font-size:.82rem;resize:vertical;outline:none}
textarea:focus{border-color:var(--brass)}
.btn.file{display:inline-flex;align-items:center}
.btn:disabled{opacity:.5;cursor:default}
details.errs{font-size:.8rem;color:var(--ng)}
details.errs ul{margin:4px 0 0;padding-left:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.72rem;letter-spacing:.12em;color:var(--ink-3)}
.field > input{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--paper);outline:none;max-width:260px}
.field > input:focus,.codein:focus{border-color:var(--brass)}
.codein{text-transform:uppercase;letter-spacing:.3em;font-size:1.1rem;max-width:160px}
.roomhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.code{margin:0;font-size:2.6rem;font-weight:500;letter-spacing:.22em;line-height:1.1}
.players{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.players li{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.players li.me{border-color:var(--brass-hi)}
.players .rk{width:1.6em;font-weight:500;color:var(--brass)}
.players .pn{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}
.players .pn small{font-weight:400;font-size:.7rem;color:var(--ink-3);margin-left:8px;border:1px solid var(--rule);border-radius:999px;padding:0 7px}
.players .pn small.host{color:var(--brass);border-color:var(--brass-hi)}
.players .pt{font-size:1.1rem}
.players .pt small{font-size:.7rem;color:var(--ink-3);margin-left:2px}
.final .players li:first-child{background:var(--brass-soft);border-color:var(--brass-hi)}
.final .players li:first-child .pt{font-size:1.4rem}
.timer{display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:4px 8px}
.timer > span{font-size:1.8rem;font-weight:500;line-height:1}
.timer > small{color:var(--ink-3)}
.timer .bar{height:8px;border-radius:999px;background:var(--rule);overflow:hidden}
.timer .bar div{height:100%;width:100%;background:var(--brass-hi);transition:width .2s linear}
.chip.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.rres{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rres li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;padding:7px 12px;border-radius:10px}
.rres li.ok{background:var(--ok-soft)} .rres li.ng{background:var(--ng-soft)}
.rres li span:first-child{font-weight:700;overflow-wrap:anywhere}
.rres li small{grid-column:1/3;color:var(--ink-2);font-size:.78rem;overflow-wrap:anywhere}
/* header menu: display mode and map shape */
.barright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.worldchip{font-size:.72rem;font-weight:700;letter-spacing:.1em;color:var(--brass);border:1px solid color-mix(in srgb,var(--brass-hi) 50%,transparent);background:var(--brass-soft);border-radius:999px;padding:2px 10px}
.menuwrap{position:relative}
.menubtn{width:38px;height:38px;border-radius:999px;border:1px solid var(--rule);background:var(--panel);display:grid;place-items:center;color:var(--ink-2)}
.menubtn[aria-expanded="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;width:min(300px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--rule);border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.18);padding:8px;display:flex;flex-direction:column;gap:4px}
.menuh{margin:6px 6px 2px;font-size:.7rem;letter-spacing:.14em;color:var(--ink-3);font-weight:700}
.mitem{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;border:1px solid transparent;background:transparent;border-radius:9px;padding:7px 10px}
.mitem small{font-size:.74rem;color:var(--ink-3);line-height:1.4}
.mitem:hover{background:var(--paper)}
.mitem[aria-pressed="true"]{border-color:var(--brass-hi);background:var(--brass-soft)}
.badge{font-size:.62rem;font-weight:700;letter-spacing:.08em;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--brass-hi);color:var(--on-brass);vertical-align:2px}
.menuseg{align-self:flex-start;margin:0 6px 4px}

/* time-slip: year bar under the globe */
.timebar{background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}
.tb-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tb-head{justify-content:space-between}
.yearbox{display:flex;align-items:baseline;gap:6px}
.era-ce{font-size:.8rem;color:var(--ink-3);letter-spacing:.1em}
.yearbtn{border:0;background:transparent;font-size:2rem;font-weight:500;line-height:1.1;padding:0 2px;border-bottom:1.5px dashed var(--rule);min-width:2.6em;text-align:center}
#tb-yinput{width:5.2em;font-size:1.6rem;border:1px solid var(--brass);border-radius:8px;padding:0 6px;background:var(--paper)}
.jpera{font-size:.82rem;border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:2px 11px;color:var(--ink-2)}
.jpera b{color:var(--ink)}
.tb-follow{font-size:.8rem;font-weight:700;color:var(--brass)}
.tb-slider{position:relative;padding-top:6px}
.tb-slider input{width:100%;margin:0;accent-color:var(--brass-hi);position:relative;z-index:1}
.tb-ticks{position:absolute;left:8px;right:8px;top:0;height:7px;pointer-events:none}
.tb-ticks span{position:absolute;top:0;width:1.5px;height:7px;background:var(--brass-hi);opacity:.75;border-radius:1px}
.tb-btns{justify-content:center;gap:6px}
.tb{border:1px solid var(--rule);background:var(--paper);border-radius:9px;padding:5px 9px;font-size:.84rem;font-weight:700;min-width:46px;font-family:var(--f-mono)}
.tb:hover{border-color:var(--brass-hi)}
.tb.play{background:var(--brass-hi);color:var(--on-brass);border-color:var(--brass-hi);min-width:56px}
.tb-opts{justify-content:space-between}
.tb-cmprow .lbl{font-size:.74rem;color:var(--ink-3);letter-spacing:.1em}
.cyear{width:5.4em;border:1px solid var(--rule);border-radius:8px;padding:4px 8px;background:var(--paper);font-size:1rem}
.cmplabels{top:56px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}
.cmplabels span{background:var(--ink);color:var(--panel);font-weight:700;font-size:.82rem;padding:2px 10px;border-radius:999px;font-family:var(--f-mono)}
.loading{left:50%;top:50%;transform:translate(-50%,-50%);background:var(--glass);border:1px solid var(--rule);padding:6px 14px;border-radius:999px;font-size:.84rem}
@media (max-width:620px){
  .tb{min-width:40px;padding:5px 6px;font-size:.78rem}
  .tb-btns{flex-wrap:nowrap;gap:4px}
  .tb-btns .tb{flex:1 1 0;min-width:0;padding:6px 2px}
  .yearbtn{font-size:1.7rem}
  .cmplabels{top:96px}
}

/* encyclopedia panel */
.hmeta{grid-template-columns:repeat(2,minmax(0,1fr))}
.hmeta .wide{grid-column:1/-1}
.spark{width:100%;height:64px;display:block}
.spark .ln{fill:none;stroke:var(--brass);stroke-width:1.6}
.spark .ar{fill:var(--brass-soft)}
.spark .now{stroke:var(--ng);stroke-width:1.4}
.spark text{font-size:10px;fill:var(--ink-3);font-family:var(--f-mono)}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.pcard{border:1px solid var(--rule);border-radius:10px;background:var(--paper);padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:64px}
.pcard b{font-family:var(--f-display);font-weight:800;letter-spacing:.03em;font-size:.98rem}
.pcard small{font-size:.72rem;color:var(--ink-3);line-height:1.35}
.pcard.locked{color:var(--ink-3);border-style:dashed;background:transparent}
.pcard.new{border-color:var(--brass-hi);box-shadow:0 0 0 2px var(--brass-soft)}
.pdesc{margin:0;font-size:.9rem;color:var(--ink-2)}
.evlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.evlist li{border:1px solid var(--rule);border-radius:10px;background:var(--paper);padding:7px 10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 10px;cursor:pointer}
.evlist li:hover{border-color:var(--brass-hi)}
.evlist .ey{font-family:var(--f-mono);color:var(--brass);font-weight:500;grid-row:1/3}
.evlist b{font-weight:700;font-size:.9rem}
.evlist small{grid-column:2;color:var(--ink-2);font-size:.78rem;line-height:1.5}
.things{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.things li{font-size:.9rem}
.things li b{margin-right:6px}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0;border:1px solid var(--h-line)}
.chip.on{border-color:var(--brass-hi);background:var(--brass-soft)}

/* guide: a novel-game text box with the character standing on it, and a spotlight on what is being explained */
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.menutog{align-self:flex-start;margin:2px 6px 4px}
.lag{position:fixed;inset:0;z-index:60;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lag.lag-dim{background:rgba(8,14,18,.3)}
.lag-spot{position:fixed;left:0;top:0;border-radius:12px;pointer-events:none;box-shadow:0 0 0 3px var(--brass-hi),0 0 0 200vmax rgba(8,14,18,.44);transition:left .3s ease,top .3s ease,width .3s ease,height .3s ease}
.lag-wrap{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(760px,calc(100% - 32px))}
.lag.lag-up .lag-wrap{bottom:auto;top:16px}
.lag-sprite{position:absolute;left:6px;bottom:calc(100% - 34px);height:clamp(150px,36vh,330px);width:auto;pointer-events:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.28));transform-origin:50% 100%}
.lag.lag-up .lag-sprite{bottom:auto;top:calc(100% - 34px);left:auto;right:6px}
.lag-box{position:relative;background:var(--panel);border:2px solid var(--brass-hi);border-radius:16px;padding:24px 22px 18px;box-shadow:0 18px 50px rgba(0,0,0,.3);outline:none}
.lag-box:focus-visible{box-shadow:0 0 0 3px var(--brass),0 18px 50px rgba(0,0,0,.3)}
.lag-name{position:absolute;left:18px;top:-16px;margin:0;display:flex;align-items:baseline;gap:7px;background:var(--ink);color:var(--panel);border-radius:999px;padding:3px 15px 4px;font-weight:700;font-size:.92rem;letter-spacing:.06em;line-height:1.4}
.lag-name small{font-size:.66rem;letter-spacing:.14em;color:var(--brass-hi)}
.lag-skip{position:absolute;right:12px;top:-14px;border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:1px 12px;font-size:.76rem;color:var(--ink-2);line-height:1.6}
.lag-skip:hover{border-color:var(--brass-hi)}
.lag-text{margin:0;font-size:1.05rem;line-height:1.85;min-height:3.7em;white-space:pre-line;overflow-wrap:anywhere}
.lag-more{position:absolute;right:18px;bottom:8px;color:var(--brass);font-size:.78rem;animation:lagbob 1s ease-in-out infinite}
.lag-choices{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.lag-choices button{border:1px solid var(--brass-hi);background:var(--brass-soft);border-radius:10px;padding:8px 20px;font-weight:700}
.lag-choices button:first-child{background:var(--brass-hi);color:var(--on-brass)}
.lag-sprite.enter{animation:lagin .42s cubic-bezier(.2,.9,.3,1.25)}
.lag-sprite.hop{animation:laghop .34s ease-out}
@keyframes lagin{from{opacity:0;transform:translateY(24px)}}
@keyframes laghop{40%{transform:translateY(-14px)}}
@keyframes lagbob{50%{transform:translateY(3px)}}
@media (max-width:620px){
  /* phones: the header wraps, so the menu hangs from the right edge of the header instead of its button */
  .bar{position:relative}
  .menuwrap{position:static}
  /* the character stands on the right, where it hides less of the left-aligned text */
  .lag-wrap{bottom:12px;width:calc(100% - 24px)}
  .lag.lag-up .lag-wrap{top:12px}
  .lag-sprite,.lag.lag-up .lag-sprite{left:auto;right:2px;height:clamp(120px,27vh,220px)}
  .lag-name{left:auto;right:14px}
  .lag-skip{right:auto;left:12px}
  .lag-box{padding:22px 16px 16px}
  .lag-text{font-size:.98rem;line-height:1.8}
}
@media (prefers-reduced-motion: reduce){.lag-sprite.enter,.lag-sprite.hop,.lag-more{animation:none}.lag-spot{transition:none}}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <circle cx="17" cy="15" r="11" fill="var(--sea-1)" stroke="var(--coast)" stroke-width="1.2"/>
        <ellipse cx="17" cy="15" rx="4.6" ry="11" fill="none" stroke="var(--coast)" stroke-width=".9"/>
        <path d="M6 15h22" stroke="var(--coast)" stroke-width=".9"/>
        <path d="M4.2 15a12.8 12.8 0 0 0 25.6 0" fill="none" stroke="var(--brass-hi)" stroke-width="2"/>
        <path d="M17 28v4M12 32h10" stroke="var(--brass-hi)" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>ごちそう地球儀</h1>
        <p id="brand-sub">回して、止まった国を知る</p>
      </div>
    </div>
    <div class="barright">
      <span class="worldchip" id="world-chip" hidden></span>
      <div class="tabs" role="tablist" aria-label="モード">
        <button role="tab" id="tab-explore" aria-selected="true" aria-controls="view-explore">探検</button>
        <button role="tab" id="tab-quiz" aria-selected="false" aria-controls="view-quiz">クイズ</button>
        <button role="tab" id="tab-battle" aria-selected="false" aria-controls="view-battle">対戦</button>
        <button role="tab" id="tab-hist" aria-selected="false" aria-controls="view-hist" hidden>図鑑</button>
        <button role="tab" id="tab-hquiz" aria-selected="false" aria-controls="view-hquiz" hidden>クイズ</button>
      </div>
      <div class="menuwrap">
        <button class="menubtn" id="menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="menu" aria-label="メニュー(表示モードと地図の形)">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="1.9" fill="currentColor"/><circle cx="10" cy="10" r="1.9" fill="currentColor"/><circle cx="16" cy="10" r="1.9" fill="currentColor"/></svg>
        </button>
        <div class="menu" id="menu" hidden>
          <p class="menuh">表示モード</p>
          <button class="mitem" data-world="modern" aria-pressed="true"><b>現代の地図</b><small>いまの国と都市、豆知識</small></button>
          <button class="mitem" data-world="history" aria-pressed="false"><b>タイムスリップ</b><small>西暦1年から1年ずつ、世界史の地図と図鑑</small></button>
          <button class="mitem" data-world="food" aria-pressed="false"><b>ごちそう<span class="badge">特別</span></b><small>郷土料理と作り方</small></button>
          <p class="menuh">地図の形</p>
          <div class="seg menuseg" role="group" aria-label="地図の形">
            <button data-shape="globe" aria-pressed="true">地球儀</button>
            <button data-shape="flat" aria-pressed="false">平面</button>
          </div>
          <p class="menuh">案内</p>
          <button class="mitem" data-lag="replay"><b>使い方を聞く</b><small>銀河義賊ラグ☆ジュアリ～が案内します</small></button>
          <button class="tog menutog" id="lag-intros" aria-pressed="true">モードを初めて開いたときに紹介する</button>
        </div>
      </div>
    </div>
  </header>

  <main class="layout">
    <div class="leftcol">
      <section class="stage" id="stage" aria-label="地球儀">
        <canvas id="globe" tabindex="0" aria-label="回せる地球儀。ドラッグで回転、ホイールやピンチで拡大、クリックで国や都市を選択"></canvas>

        <div class="ov top">
          <div class="search">
            <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.6 3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <input id="q" type="search" placeholder="国名・都市名で探す" autocomplete="off" aria-label="国名・都市名で探す" aria-controls="suggest">
            <ul class="suggest" id="suggest" role="listbox" hidden></ul>
          </div>
          <div class="toggles">
            <button class="tog" id="t-labels" aria-pressed="true">国名</button>
            <button class="tog" id="t-cities" aria-pressed="true">都市</button>
            <button class="tog" id="t-modern" aria-pressed="false" hidden>現代の国境</button>
            <button class="tog" id="t-auto" aria-pressed="true">自動回転</button>
            <button class="tog" id="t-sfx" aria-pressed="true">効果音</button>
          </div>
        </div>

        <div class="ov readout" id="readout" hidden></div>
        <div class="ov tip" id="tip" hidden></div>
        <div class="ov toast" id="toast" hidden></div>
        <div class="ov cmplabels" id="cmp-labels" hidden><span id="cmp-l"></span><span id="cmp-r"></span></div>
        <div class="ov loading" id="h-loading" hidden>地図を読み込んでいます…</div>

        <div class="ov zoom">
          <button id="z-in" aria-label="拡大">＋</button>
          <button id="z-out" aria-label="縮小">−</button>
          <button id="z-home" aria-label="全体を表示">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><ellipse cx="8" cy="8" rx="2.6" ry="6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
        </div>

        <div class="ov spin" id="spin-wrap">
          <button class="spin-btn" id="spin-btn">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M15 9a6 6 0 1 1-2-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M13.6 1.6v3.6H10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="spin-label">シャッフル</span>
          </button>
          <div class="seg" id="target-seg" role="group" aria-label="シャッフルの対象">
            <button data-t="both" aria-pressed="true">国と都市</button>
            <button data-t="country" aria-pressed="false">国</button>
            <button data-t="city" aria-pressed="false">都市</button>
          </div>
        </div>

        <div class="ov coords mono" id="coords"></div>
      </section>

      <section class="timebar" id="timebar" aria-label="年代" hidden>
        <div class="tb-row tb-head">
          <div class="yearbox">
            <span class="era-ce">西暦</span>
            <button class="yearbtn mono" id="tb-year" title="クリックして年を入力">1</button>
            <form id="tb-yform" hidden><input id="tb-yinput" class="mono" type="number" min="1" max="2024" step="1" aria-label="年を入力"></form>
            <span class="era-ce">年</span>
          </div>
          <span class="jpera" id="tb-jp" title="この年の日本"></span>
          <span class="tb-follow" id="tb-follow" hidden></span>
        </div>
        <div class="tb-slider">
          <div class="tb-ticks" id="tb-ticks" aria-hidden="true"></div>
          <input type="range" id="tb-range" min="1" max="2024" step="1" value="1" aria-label="年代(1年ずつ)">
        </div>
        <div class="tb-row tb-btns">
          <button class="tb" data-step="-100" aria-label="100年前へ">«100</button>
          <button class="tb" data-step="-10" aria-label="10年前へ">‹10</button>
          <button class="tb" data-step="-1" aria-label="1年前へ">‹1</button>
          <button class="tb play" id="tb-play" aria-label="再生">▶</button>
          <button class="tb" data-step="1" aria-label="1年後へ">1›</button>
          <button class="tb" data-step="10" aria-label="10年後へ">10›</button>
          <button class="tb" data-step="100" aria-label="100年後へ">100»</button>
        </div>
        <div class="tb-row tb-opts">
          <div class="seg" id="tb-speed" role="group" aria-label="再生の速さ">
            <button data-sp="slow" aria-pressed="false">ゆっくり</button>
            <button data-sp="normal" aria-pressed="true">ふつう</button>
            <button data-sp="fast" aria-pressed="false">はやい</button>
          </div>
          <button class="tog" id="tb-cmp" aria-pressed="false">2つの年を比べる</button>
        </div>
        <div class="tb-row tb-cmprow" id="tb-cmprow" hidden>
          <span class="lbl">左側の年</span>
          <button class="tb" data-cstep="-100">«100</button>
          <button class="tb" data-cstep="-10">‹10</button>
          <input id="tb-cyear" class="mono cyear" type="number" min="1" max="2024" step="1" aria-label="比べる年">
          <button class="tb" data-cstep="10">10›</button>
          <button class="tb" data-cstep="100">100»</button>
          <small class="note">地図の仕切りを左右にドラッグできます</small>
        </div>
      </section>
    </div>

    <aside class="panel" id="panel">
      <div id="view-explore" role="tabpanel" aria-labelledby="tab-explore"></div>
      <div id="view-quiz" role="tabpanel" aria-labelledby="tab-quiz" hidden></div>
      <div id="view-battle" role="tabpanel" aria-labelledby="tab-battle" hidden></div>
      <div id="view-hist" role="tabpanel" aria-labelledby="tab-hist" hidden></div>
      <div id="view-hquiz" role="tabpanel" aria-labelledby="tab-hquiz" hidden></div>
      <div class="foot">
        <p class="note" id="foot-note">地図: Natural Earth 1:50m(world-atlas)。国境線は実効支配線にもとづき、帰属に争いのある地域は斜線で示しています。</p>
      </div>
    </aside>
  </main>
</div>

<div class="lag" id="lag" hidden>
  <div class="lag-spot" id="lag-spot" hidden></div>
  <div class="lag-wrap">
    <img class="lag-sprite" id="lag-sprite" alt="" aria-hidden="true">
    <div class="lag-box" id="lag-box" role="dialog" aria-label="銀河義賊ラグ☆ジュアリ～の案内" tabindex="-1">
      <p class="lag-name"><small>銀河義賊</small>ラグ☆ジュアリ～</p>
      <button class="lag-skip" id="lag-skip">スキップ</button>
      <p class="lag-text" id="lag-text" aria-hidden="true"></p>
      <p class="sr" id="lag-live" aria-live="polite"></p>
      <div class="lag-choices" id="lag-choices" hidden></div>
      <span class="lag-more" id="lag-more" aria-hidden="true" hidden>▼</span>
    </div>
  </div>
</div>

// Columns are matched by header name, so their order does not matter.
const QCOLS = ['問題', '答え', 'ジャンル', '難易度', '解説', '答えの種類', '場所', '選択肢'];
const QALIAS = { '場所': ['国', '国名', '関連国', '対象国', '地名'], '答えの種類': ['種類'] };

// Answers may carry their reading in brackets, e.g. 赤道ギニア（せきどうぎにあ） or
// 日本（にほん/にっぽん）: the part outside is shown, and the readings are accepted too.
function answerAlts(s) {
  const readings = [];

    if (/^[\sぁ-ゖァ-ヺー・\/／]+$/.test(inner)) { readings.push(...splitAlts(inner)); return ''; }
    return m;

  for (const a of splitAlts(base).concat(readings)) { const k = norm(a); if (k && !seen.has(k)) { seen.add(k); out.push(a); } }

  }

const SFX = {

    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);

  play(name) {
    if (!this.on) return;

    const c = this.ctx; if (!c) return;
    const t = c.currentTime + 0.03;
    if (name === 'question') {          // "てーん": one bell-like note
      this.tone(1046.5, t, 1.2, 'sine', 0.24);
      this.tone(2093.0, t, 0.5, 'sine', 0.06);
      this.tone(2889.0, t, 0.22, 'sine', 0.025);

/* ================= time slip: world history map ================= */
// Borders come from Cliopatria, one TopoJSON file per century under history/. A file is
// fetched the first time its century is shown, so the modern map stays as light as before.
const KM2 = 6371.0088 * 6371.0088;
const YMIN = 1, YMAX = 2024;
const fmtYear = y => y <= 0 ? `前${-y}年` : `${y}年`;
const startOf = p => p.s != null ? p.s : p.f;
function periodText(p) {
  const a = startOf(p), b = p.t;
  return b >= YMAX ? `${fmtYear(a)}〜` : `${fmtYear(a)}〜${fmtYear(b)}`;
}
function fmtArea(a) {
  const sig2 = x => { const e = Math.pow(10, Math.max(0, Math.floor(Math.log10(x)) - 1)); return Math.round(x / e) * e; };
  if (a >= 1e5) return `約${sig2(a / 1e4).toLocaleString()}万km²`;
  if (a >= 1e4) return `約${(Math.round(a / 1e3) / 10).toFixed(1)}万km²`;
  return `約${sig2(Math.max(1, a)).toLocaleString()}km²`;
}
// Japan's period for a year; from Meiji on, the era name and its year
const JP_PERIODS = [[1, '弥生時代'], [250, '古墳時代'], [592, '飛鳥時代'], [710, '奈良時代'], [794, '平安時代'], [1185, '鎌倉時代'],
  [1333, '建武の新政'], [1336, '南北朝時代'], [1392, '室町時代'], [1467, '戦国時代'], [1573, '安土桃山時代'], [1603, '江戸時代'],
  [1868, '明治時代'], [1912, '大正時代'], [1926, '昭和時代'], [1989, '平成'], [2019, '令和']];
const GENGO = [['明治', 1868], ['大正', 1912], ['昭和', 1926], ['平成', 1989], ['令和', 2019]];
function jpEraHTML(y) {
  let per = JP_PERIODS[0][1];
  for (const [s, n] of JP_PERIODS) if (y >= s) per = n;
  if (y < 1868) return `日本は <b>${per}</b>`;
  const gs = [];
  GENGO.forEach(([n, s], i) => { const next = GENGO[i + 1]; if (y >= s && (!next || y <= next[1])) gs.push(`${n}${y - s + 1 === 1 ? '元' : y - s + 1}年`); });
  return `日本は <b>${gs.join('・')}</b>`;
}
// "李淵/高祖" (a name and its other spellings) is shown as 李淵(高祖); several capitals as 平城・洛陽
const dispName = v => { const a = splitAlts(v); return a.length > 1 ? `${a[0]}(${a.slice(1).join('、')})` : a[0] || ''; };
const dispList = v => splitAlts(v).join('・');
// names written with a qualifier in brackets also accept the bare name and the bracketed one
function altNames(n, extra) {
  const out = [n];
  const bare = n.replace(/[（(][^）)]*[）)]/g, '').trim();
  if (bare && bare !== n) out.push(bare);
  const inner = n.match(/[（(]([^）)]*)[）)]/);
  if (inner) inner[1].split(/[・、]/).forEach(x => { x = x.trim(); if (x.length >= 2 && !/時代|など|以後|以前/.test(x)) out.push(x); });
  if (extra) splitAlts(extra).forEach(x => out.push(x));
  return [...new Set(out)];
}

const chunkOf = y => TS.idx.chunks.find(c => y >= c[0] && y <= c[1]);
function loadChunk(c) {
  const file = c[2];
  let ch = TS.chunks.get(file);
  if (ch) return ch.promise;
  ch = { ready: false, rows: null };
  ch.promise = fetch(histUrl(file)).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(topo => {
    const feats = topojson.feature(topo, topo.objects.p).features;

    const lods = LOD_EPS.map(eps => { const st = simplifyTopology(topo, eps); return topojson.feature(st, st.objects.p).features.map(dropInsideOut); });
    ch.rows = [];
    feats.forEach((f, k) => {
      if (!f.geometry) return;
      const q = f.properties;
      // a: area of the shape; o: its area before overlaps were cut out (orders drawing and clicks)
      ch.rows.push({ p: TS.P[q.i], f: q.f, t: q.t, lp: q.l, a: q.a, o: q.o != null ? q.o : q.a, r: q.r, feat: f, lod: [lods[0][k], lods[1][k], f], b: null });
    });

    return ch;
  });
  ch.promise.catch(() => { TS.chunks.delete(file); toast('地図データを読み込めませんでした'); });

}
// rows (polity shapes) that exist in year y, biggest first so small ones are drawn on top

function rowsAt(y) {
  const ch = TS.chunks.get(chunkOf(y)[2]);
  if (!ch || !ch.ready) return null;
  const leaf = [], grp = [];
  for (const r of ch.rows) if (r.f <= y && y <= r.t) (r.p.g ? grp : leaf).push(r);
  leaf.sort((a, b) => b.o - a.o);
  return { y, leaf, grp };
}

function inBox(b, ll) {
  const [lon, lat] = ll;
  if (lat < b[0][1] - 0.01 || lat > b[1][1] + 0.01) return false;
  return b[0][0] <= b[1][0] ? (lon >= b[0][0] - 0.01 && lon <= b[1][0] + 0.01) : (lon >= b[0][0] || lon <= b[1][0]);
}
function rowAt(set, ll) {
  if (!set || !countryAt(ll)) return null;   // shapes reach into the sea a little; only land counts
  let best = null;
  for (const r of set.leaf) {
    if (!r.b) r.b = d3.geoBounds(r.feat);
    if (!inBox(r.b, ll)) continue;
    if ((!best || r.o < best.o) && d3.geoContains(r.feat, ll)) best = r;
  }
  return best;
}

/* ---------- playback (and following one polity) ---------- */
function startPlay(follow) {
  if (!TS.idx) return;

  stopPlay();

}

}
function stopPlay() {

}
function playTick() {

  if (TS.year >= end) {

    return;
  }
  // wait for the next century's data instead of skipping years
  const ch = TS.chunks.get(chunkOf(next)[2]);
  if (!ch || !ch.ready) { ensureYear(next); return; }

  const c = center();
  if (d3.geoDistance(c, r.lp) * 180 / Math.PI < 2 && Math.abs(Math.log(z / zoom)) < 0.15) return;
  if (anim && anim.follow) return;
  const a = animateTo(r.lp[0], r.lp[1], z, { dur: 700 });
  a.follow = true;
}

/* ---------- which modern countries a shape covers ---------- */
function modernShare(r) {
  if (TS.geoCache.has(r)) return TS.geoCache.get(r);
  if (!r.b) r.b = d3.geoBounds(r.feat);
  const [[x0, y0], [x1, y1]] = r.b;
  const w = x1 >= x0 ? x1 - x0 : x1 + 360 - x0, h = y1 - y0;
  const step = Math.max(0.12, Math.sqrt(w * h / 700));
  const count = new Map(); let n = 0;
  for (let y = y0 + step / 2; y < y1; y += step) {
    for (let dx = step / 2; dx < w; dx += step) {
      let x = x0 + dx; if (x > 180) x -= 360;
      const ll = [x, y];
      if (!d3.geoContains(r.feat, ll)) continue;
      const f = countryAt(ll);
      if (!f) continue;
      n++; count.set(f.id, (count.get(f.id) || 0) + 1);
    }
  }
  if (!n) { const f = countryAt(r.lp); if (f) { n = 1; count.set(f.id, 1); } }
  const out = [...count].map(([id, k]) => [placeById.get(id), k / n]).filter(([p, s]) => p && (s >= 0.04 || count.size <= 3)).sort((a, b) => b[1] - a[1]).slice(0, 8);
  TS.geoCache.set(r, out);
  return out;
}

// 地図: the globe stops on a highlighted area in some year and asks who ruled it.
// 図鑑: questions made from the encyclopedia (founder, capital, people, inventions).
const HQ_RANGES = [['all', '全期間', 1, 2024], ['a', '1〜500年', 1, 500], ['b', '501〜1000年', 501, 1000], ['c', '1001〜1500年', 1001, 1500], ['d', '1501〜1800年', 1501, 1800], ['e', '1801年〜', 1801, 2024]];
const HQ = {
  kind: 'both', mode: 'choice', range: 'all', state: 'idle', cur: null, n: 0, correct: 0, streak: 0, best: store.get('h-best', 0),
  view: null, read: null, phase: '', token: 0, pool: []
};
const histBusy = () => mode === 'hquiz' && (HQ.state === 'spinning' || HQ.state === 'asking');
// leaving the quiz tab drops an unanswered question, so the year bar is free again
function hqAbandon() {
  if (HQ.state !== 'spinning' && HQ.state !== 'asking') return;
  HQ.token++; HQ.state = 'idle'; HQ.view = null; HQ.read = null; HQ.cur = null;
  if (HQ.n > 0) HQ.n--;
}
const histAsking = () => world === 'history' && histBusy();
// a representative year: when the polity was largest
function peakYear(p) {
  const h = p.h || []; let best = p.f, ba = -1;
  for (let i = 0; i < h.length; i += 2) if (h[i + 1] > ba) { ba = h[i + 1]; best = Math.round((h[i] + (i + 2 < h.length ? h[i + 2] - 1 : p.t)) / 2); }
  return clamp(best, p.f, p.t);
}
function buildHQPool() {
  const pool = [];
  for (const p of TS.P) {
    const z = p.z; if (!z) continue;
    const year = z['代表年'] ? clamp(parseInt(z['代表年'], 10) || peakYear(p), YMIN, YMAX) : peakYear(p);
    const base = { p, year };
    if (z['建国者']) pool.push({ ...base, cat: '人物', text: `${p.n}を建国した人物はだれ?`, alts: splitAlts(z['建国者']), person: splitAlts(z['建国者'])[0] });
    if (z['首都']) pool.push({ ...base, cat: '首都', text: `${p.n}の首都(都)はどこ?`, alts: splitAlts(z['首都'].replace(/[（(].*?[）)]/g, '')) });
    for (const [name, desc] of z.people) {
      if (!desc) continue;
      pool.push({ ...base, cat: '人物', text: `【${p.n}】${desc.replace(/。$/, '')}。この人物はだれ?`, alts: splitAlts(name), person: name });
      pool.push({ ...base, cat: '勢力', text: `${splitAlts(name)[0]}が活躍した国(王朝)はどこ?`, alts: altNames(p.n, z['別名']), person: name, hideP: true });
    }
    for (const [name, desc, kind] of z.things) {
      if (!desc) continue;
      pool.push({ ...base, cat: kind, text: `【${p.n}】${desc.replace(/。$/, '')}。これは何?`, alts: splitAlts(name) });
    }
  }
  HQ.pool = pool;
}
function hqRange() { const r = HQ_RANGES.find(x => x[0] === HQ.range) || HQ_RANGES[0]; return [r[2], r[3]]; }
function zukanPool() { const [a, b] = hqRange(); return HQ.pool.filter(q => q.year >= a && q.year <= b); }
async function makeMapQuestion() {
  const [a, b] = hqRange();
  for (let tries = 0; tries < 8; tries++) {
    const y = a + Math.floor(Math.random() * (b - a + 1));
    await ensureYear(y);
    const set = rowsAt(y);
    if (!set) continue;
    const named = set.leaf.filter(r => r.p.z || r.a >= 120000);
    if (named.length < 4) continue;
    const w = named.map(r => Math.sqrt(r.a) * (r.p.z ? 2.5 : 1));
    let x = Math.random() * w.reduce((s, v) => s + v, 0), row = named[0];
    for (let i = 0; i < named.length; i++) { x -= w[i]; if (x <= 0) { row = named[i]; break; } }
    const others = set.leaf.filter(r => r.p !== row.p && r.p.n !== row.p.n && (r.p.z || r.a >= 20000))
      .sort((r1, r2) => d3.geoDistance(r1.lp, row.lp) - d3.geoDistance(r2.lp, row.lp));
    const names = [...new Set(others.map(r => r.p.n))];
    if (names.length < 3) continue;
    const near = names.slice(0, 6);
    return { type: 'map', p: row.p, year: y, row, cat: '勢力', text: `${fmtYear(y)}、地図で示した地域を支配していたのは?`, alts: altNames(row.p.n, row.p.z && row.p.z['別名']), choices: shuffleArr([row.p.n, ...shuffleArr(near).slice(0, 3)]) };
  }
  return null;
}
function makeZukanQuestion() {
  const pool = zukanPool();
  if (!pool.length) return null;
  const q = { ...pool[Math.floor(Math.random() * pool.length)], type: 'zukan' };
  // wrong choices: answers of the same kind from other questions
  const thing = c => c === '発明' || c === '文化';
  const same = [...new Set(HQ.pool.filter(x => (x.cat === q.cat || (thing(x.cat) && thing(q.cat))) && norm(x.alts[0]) !== norm(q.alts[0])).map(x => x.cat === '勢力' ? x.p.n : x.alts[0]))];
  if (q.cat === '勢力' && same.length < 3) TS.P.filter(p => p.z && p !== q.p).forEach(p => same.push(p.n));
  const ans = q.cat === '勢力' ? q.p.n : q.alts[0];
  const picks = shuffleArr(same.filter(x => !q.alts.map(norm).includes(norm(x)))).slice(0, 3);
  q.choices = picks.length === 3 ? shuffleArr([ans, ...picks]) : null;
  q.ans = ans;
  return q;
}
async function histNextQuestion() {
  if (spinning || !TS.idx) return;

  HQ.view = null;

  const useMap = HQ.kind === 'map' || (HQ.kind === 'both' && (Math.random() < 0.5 || !zukanPool().length));
  let q = useMap ? await makeMapQuestion() : makeZukanQuestion();

  if (tok !== HQ.token) return;
  if (!q) { HQ.state = 'idle'; updateSpinLabel(); renderHQuiz(); syncTimebar(); toast('この条件で出せる問題がありません'); return; }
  if (!q.ans) q.ans = q.cat === '勢力' ? q.p.n : q.alts[0];

function hqAnswer(text, picked) {

    if (!norm(text)) { toast('答えを入力してください'); return; }

};
const Lag = { on: false, key: '', lines: [], i: 0, line: null, chars: [], shown: 0, timer: 0, q: [], spotEl: null, spotKey: '', raf: 0, focus: null };
const lagEl = $('#lag'), lagBox = $('#lag-box'), lagImg = $('#lag-sprite'), lagSpot = $('#lag-spot');
lagImg.addEventListener('animationend', () => lagImg.classList.remove('enter', 'hop'));
function lagRun(key) {
  if (!LAG[key]) return;
  if (Lag.on) { if (Lag.key !== key && !Lag.q.includes(key)) Lag.q.push(key); return; }
  if (!lagEl.hidden) return;
  LAG_POSES.forEach(p => { new Image().src = `img/lag-${p}.webp`; });
  Lag.on = true; Lag.focus = document.activeElement;
  hideTip(); stopMotion();
  lagEl.hidden = false;
  lagImg.classList.remove('hop'); lagImg.classList.add('enter');
  lagStart(key);
  lagBox.focus({ preventScroll: true });
  if (!Lag.raf) Lag.raf = requestAnimationFrame(lagTick);
}
function lagStart(key) {
  Lag.key = key;
  if (key !== 'hello' && key !== 'later') { lagSeen[key] = true; lagSave(); }
  Lag.lines = LAG[key]();
  lagLine(0);
}
function lagLine(i) {
  if (i >= Lag.lines.length) { lagEnd(); return; }
  Lag.i = i;
  const [pose, text, o = {}] = Lag.lines[i];
  Lag.line = o;
  if (o.do) o.do();
  if (lagImg.dataset.pose !== pose) {   // a little hop on each change of pose
    const had = !!lagImg.dataset.pose;
    lagImg.dataset.pose = pose; lagImg.src = `img/lag-${pose}.webp`;
    if (had && !lagImg.classList.contains('enter')) { lagImg.classList.remove('hop'); void lagImg.offsetWidth; lagImg.classList.add('hop'); }
  }
  Lag.chars = Array.from(text); Lag.shown = 0;
  $('#lag-text').textContent = '';
  $('#lag-live').textContent = text;
  $('#lag-choices').hidden = true; $('#lag-more').hidden = true;
  lagSetSpot(o.spot);
  lastInteract = now();
  clearTimeout(Lag.timer);
  if (REDUCED) lagFinishLine(); else lagType();
}
function lagType() {
  if (Lag.shown >= Lag.chars.length) { lagFinishLine(); return; }
  const ch = Lag.chars[Lag.shown++];
  $('#lag-text').textContent = Lag.chars.slice(0, Lag.shown).join('');
  Lag.timer = setTimeout(lagType, '、。！？!?…'.includes(ch) ? 150 : ch === '\n' ? 220 : 34);
}
function lagFinishLine() {
  clearTimeout(Lag.timer);
  Lag.shown = Lag.chars.length;
  $('#lag-text').textContent = Lag.chars.join('');
  const ch = Lag.line && Lag.line.choices;
  if (ch) {
    const box = $('#lag-choices');
    box.innerHTML = ch.map(([label], k) => `<button data-lc="${k}">${esc(label)}</button>`).join('');
    box.hidden = false;
    box.querySelector('button').focus({ preventScroll: true });
  } else $('#lag-more').hidden = false;
}
function lagAdvance() {
  if (!Lag.on) return;
  if (Lag.shown < Lag.chars.length) { lagFinishLine(); return; }
  if (Lag.line && Lag.line.choices) return;   // waiting for an answer
  lagLine(Lag.i + 1);
}
// finish this script and go on to the given ones (from a choice)
function lagThen(keys) { Lag.q.unshift(...keys); lagEnd(); }
function lagEnd() {
  clearTimeout(Lag.timer);
  if (Lag.key === 'hello' || Lag.key === 'later') { lagSeen.asked = true; lagSave(); }
  const next = Lag.q.shift();
  if (next) { lagStart(next); return; }
  Lag.on = false; Lag.key = ''; Lag.spotEl = null; Lag.spotKey = '';
  lagEl.hidden = true; lagSpot.hidden = true;
  lagImg.classList.remove('hop', 'enter'); delete lagImg.dataset.pose;
  openMenu(false);
  lastInteract = now();
  // give focus back (to the ⋯ button when the guide was called from the menu, which is now closed)
  const f = Lag.focus;
  if (f && f.focus && document.contains(f) && f.getClientRects().length) f.focus({ preventScroll: true });
  else if (f && f.closest && f.closest('.menuwrap')) menuBtn.focus({ preventScroll: true });
}
function lagSkip() {
  if (Lag.key === 'hello') { lagSeen.asked = true; lagSave(); }
  Lag.q.length = 0;
  lagEnd();
}
function lagSetSpot(sel) {
  const el = sel ? document.querySelector(sel) : null;
  Lag.spotEl = el && el.getClientRects().length ? el : null;
  Lag.spotKey = '';
  if (Lag.spotEl) {
    // bring it into view (phones stack the panel under the globe)
    const r = Lag.spotEl.getBoundingClientRect();
    if (r.top < 0 || r.bottom > innerHeight) Lag.spotEl.scrollIntoView({ block: r.height > innerHeight * 0.6 ? 'start' : 'center', behavior: 'auto' });
  }
  lagPlace();
}
// the text box goes to the top when the lit-up part is in the lower half of the screen
function lagPlace() {
  let top = false;
  if (Lag.spotEl) {
    const r = Lag.spotEl.getBoundingClientRect();
    top = r.height < innerHeight * 0.5 && (r.top + r.bottom) / 2 > innerHeight * 0.55;
  }
  lagEl.classList.toggle('lag-up', top);
  lagEl.classList.toggle('lag-dim', !Lag.spotEl);
}
function lagTick() {
  Lag.raf = 0;
  if (!Lag.on) return;
  const el = Lag.spotEl;
  if (el && el.getClientRects().length) {
    const r = el.getBoundingClientRect(), pad = 6;
    const x = Math.max(4, r.left - pad), y = Math.max(4, r.top - pad);
    const w = Math.min(innerWidth - 4, r.right + pad) - x, h = Math.min(innerHeight - 4, r.bottom + pad) - y;
    const k = `${x | 0},${y | 0},${w | 0},${h | 0}`;
    if (k !== Lag.spotKey) {
      const firstShow = lagSpot.hidden;
      if (firstShow) lagSpot.style.transition = 'none';
      Object.assign(lagSpot.style, { left: x + 'px', top: y + 'px', width: Math.max(0, w) + 'px', height: Math.max(0, h) + 'px' });
      lagSpot.hidden = h <= 0 || w <= 0;
      if (firstShow) { void lagSpot.offsetWidth; lagSpot.style.transition = ''; }
      Lag.spotKey = k;
    }
  } else if (!lagSpot.hidden) { lagSpot.hidden = true; lagEl.classList.add('lag-dim'); }
  Lag.raf = requestAnimationFrame(lagTick);
}
lagEl.addEventListener('click', e => {
  e.stopPropagation();   // keep the ⋯ menu open while it is being explained
  const c = e.target.closest('[data-lc]');
  if (c) { const fn = Lag.line && Lag.line.choices && Lag.line.choices[+c.dataset.lc]; if (fn) fn[1](); return; }
  if (e.target.closest('#lag-skip')) { lagSkip(); return; }
  lagAdvance();
});
// on window, so it runs before the page's own shortcuts (typing jumps to the answer box, Enter = next question)
addEventListener('keydown', e => {
  if (!Lag.on) return;
  const onBtn = e.target.closest && e.target.closest('#lag button');
  if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); lagSkip(); return; }
  if ((e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') && !onBtn) { e.preventDefault(); e.stopImmediatePropagation(); lagAdvance(); return; }
  if (e.key === 'Tab') {   // keep focus inside the guide
    const f = [lagBox, ...lagEl.querySelectorAll('button:not([hidden])')].filter(x => x.getClientRects().length);
    const i = f.indexOf(document.activeElement);
    e.preventDefault(); f[(i + (e.shiftKey ? f.length - 1 : 1)) % f.length].focus();
  }
}, true);
addEventListener('resize', () => { if (Lag.on) { Lag.spotKey = ''; lagPlace(); } });
// the first time a mode is opened (after the first-visit question has been answered)
function lagAuto(key) {
  if (!LAG[key] || roomLink || B.net || lagSeen.off || !lagSeen.asked || lagSeen[key]) return;
  lagRun(key);
}
function syncLagMenu() { $('#lag-intros').setAttribute('aria-pressed', String(!lagSeen.off)); }
syncLagMenu();
$('#lag-intros').onclick = () => { lagSeen.off = !lagSeen.off; lagSave(); syncLagMenu(); };
$('[data-lag="replay"]').onclick = () => {
  openMenu(false);
  if (spinning || battleBusy()) { toast('いまの勝負が終わってから呼んでくれたまえ'); return; }
  lagRun(world === 'history' ? 'history' : 'base');
};

/* ---------------- start ---------------- */
select(placeById.get('JPN'));
recent.length = 0; recent.push(placeById.get('JPN'));
renderQuiz();
renderBattle();
updateSpinLabel();
document.querySelectorAll('[data-shape]').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.shape === 'flat') === flat)));
if (flat) { flat = false; setFlat(true); }
const hm = location.hash.match(/^#room-([A-Za-z0-9]{4})$/);
if (hm) { B.joinCode = hm[1].toUpperCase(); setMode('battle'); }
else if (location.hash === '#timeslip') setWorld('history');
else if (location.hash === '#food') setWorld('food');
// first visit: ask whether to hear the guide (not when arriving through a battle invitation)
if (!roomLink && !lagSeen.asked) setTimeout(() => { if (!spinning) lagRun('hello'); }, 900);
window.__globe = { B, SQ, QUIZ, TS, HQ, allQs, buildQuestions, findMentions, makeChoices, setWorld, setFlat, setYear, llAt, histAt, lag: { run: lagRun, seen: lagSeen, state: Lag } };
})();
